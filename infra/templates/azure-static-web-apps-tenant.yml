name: Azure Static Web Apps CI/CD - __TENANT_SLUG__

on:
  push:
    branches:
      - __RELEASE_BRANCH__

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy __TENANT_SLUG__
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.__GITHUB_SECRET_NAME__ }}
          action: "upload"
          app_location: "./frontend"
          api_location: "./functions"
          output_location: "/dist/app/browser"
          production_branch: "__RELEASE_BRANCH__"
