name: Azure Static Web Apps CI/CD - chili

on:
  push:
    branches:
      - release/chili

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy chili
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CHILI }}
          action: "upload"
          app_location: "./frontend"
          api_location: "./functions"
          output_location: "/dist/app/browser"
          production_branch: "release/chili"
