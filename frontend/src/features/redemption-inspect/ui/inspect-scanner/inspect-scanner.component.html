<ion-header>
  <ion-toolbar>
    <ion-title>Сканування</ion-title>
    <ion-buttons slot="end">
      <app-theme-mode-selector />
      <ion-button fill="clear" aria-label="Закрити" (click)="close()">
        <ion-icon slot="icon-only" name="close-outline" aria-hidden="true" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <zxing-scanner
    #scanner
    [tryHarder]="true"
    (scanSuccess)="handleScanSuccess($event)"
    (permissionResponse)="handlePermissionResponse($event)"
    (camerasFound)="handleCamerasFound($event)"
    (camerasNotFound)="handleCamerasNotFound()"
  />

  <ion-note [color]="lastScannedValue() ? 'success' : 'medium'">
    {{ statusMessage() }}
  </ion-note>
</ion-content>
