<ion-header>
  <ion-toolbar>
    <ion-title>{{ title() }}</ion-title>
    <ion-buttons slot="end">
      <app-theme-mode-selector />
      @if (isModalPresentation()) {
        <ion-button fill="clear" aria-label="Закрити" (click)="close()">
          <ion-icon slot="icon-only" name="close-outline" aria-hidden="true" />
        </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="customer-profile-form">
  <ion-grid fixed class="ion-padding">
    <ion-row class="ion-justify-content-center">
      <ion-col
        size="12"
        [sizeMd]="isModalPresentation() ? '12' : '7'"
        [sizeLg]="isModalPresentation() ? '12' : '5'"
      >
        <form novalidate [formGroup]="profileForm" (ngSubmit)="submit($event)">
          <ion-list class="customer-profile-form__fields ion-padding-top">
            <div class="customer-profile-form__field">
              <ion-input
                label="Номер телефону"
                labelPlacement="stacked"
                type="text"
                inputmode="numeric"
                autocomplete="tel"
                fill="outline"
                maxlength="9"
                pattern="[0-9]*"
                [counter]="true"
                placeholder="501234567"
                helperText="Введіть 9 цифр номера."
                [errorText]="phoneErrorText()"
                [class.ion-touched]="isPhoneTouched()"
                [attr.aria-invalid]="shouldShowPhoneError()"
                formControlName="phone"
              >
                <ion-text slot="start" color="primary" aria-hidden="true">+380</ion-text>
              </ion-input>
            </div>

            <div class="customer-profile-form__field">
              <ion-card class="physical-card-number-card ion-no-margin">
                <ion-card-content>
                  <ion-input
                    label="Номер фізичної картки"
                    labelPlacement="stacked"
                    type="text"
                    inputmode="numeric"
                    fill="outline"
                    maxlength="13"
                    pattern="[0-9]*"
                    [counter]="true"
                    helperText="Введіть 13 цифр EAN-13."
                    [errorText]="physicalCardNumberErrorText()"
                    [class.ion-touched]="isPhysicalCardNumberTouched()"
                    [attr.aria-invalid]="shouldShowPhysicalCardNumberError()"
                    formControlName="physicalCardNumber"
                  />

                  <ion-button
                    class="ion-margin-top"
                    color="secondary"
                    expand="block"
                    type="button"
                    (click)="openPhysicalCardScanner()"
                  >
                    <ion-icon slot="start" name="barcode-outline" aria-hidden="true" />
                    Сканувати номер картки
                  </ion-button>
                </ion-card-content>
              </ion-card>
            </div>

            @for (field of fieldViews; track field.config.code) {
              <div class="customer-profile-form__field">
                @if (field.config.form.control === 'textarea') {
                  <ion-textarea
                    [label]="field.config.label"
                    labelPlacement="stacked"
                    fill="outline"
                    [autoGrow]="true"
                    [counter]="field.config.maxLength !== undefined"
                    [attr.maxlength]="field.config.maxLength ?? null"
                    [errorText]="field.errorText()"
                    [class.ion-touched]="field.isTouched()"
                    [attr.aria-invalid]="field.shouldShowError()"
                    [formControl]="field.control"
                  />
                } @else {
                  <ion-input
                    [label]="field.config.label"
                    labelPlacement="stacked"
                    [type]="field.config.type === 'date' ? 'date' : 'text'"
                    [autocomplete]="field.config.form.autocomplete ?? null"
                    fill="outline"
                    [counter]="field.config.maxLength !== undefined"
                    [attr.maxlength]="field.config.maxLength ?? null"
                    [errorText]="field.errorText()"
                    [class.ion-touched]="field.isTouched()"
                    [attr.aria-invalid]="field.shouldShowError()"
                    [formControl]="field.control"
                  />
                }
              </div>
            }
          </ion-list>

          <div class="ion-padding-top">
            <ion-button
              [appDisabledButtonColor]="!canSubmit()"
              expand="block"
              size="large"
              type="submit"
              [disabled]="!canSubmit()"
              [attr.aria-busy]="isSaving()"
            >
              @if (isSaving()) {
                <ion-spinner name="crescent" aria-hidden="true" />
                <span class="ion-margin-start">Зберігаємо...</span>
              } @else {
                {{ submitText() }}
              }
            </ion-button>
          </div>
        </form>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
