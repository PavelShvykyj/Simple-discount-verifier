<ion-header>
  <ion-toolbar>
    <ion-title>Сервісні функції</ion-title>
    <ion-buttons slot="end">
      <app-theme-mode-selector />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="admin-page">
  <ion-grid fixed class="ion-padding">
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-lg="8">
        <ion-list inset>
          <ion-item routerLink="/admin/service/inspect" detail>
            <ion-icon slot="start" name="qr-code-outline" aria-hidden="true" />
            <ion-label>
              <h2>Код підтримки</h2>
              <p>Знайти інформацію про звернення клієнта за кодом з його екрана.</p>
            </ion-label>
          </ion-item>

          <ion-item routerLink="/admin/service/health" detail>
            <ion-icon slot="start" name="pulse-outline" aria-hidden="true" />
            <ion-label>
              <h2>Стан сервісу</h2>
              <p>Перевірити, чи доступна система знижок.</p>
            </ion-label>
          </ion-item>

          <ion-item disabled>
            <ion-icon slot="start" name="barcode-outline" aria-hidden="true" />
            <ion-label>
              <h2>Тест сканерів</h2>
              <p>Перевірити, чи касові сканери та камера читають коди.</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
